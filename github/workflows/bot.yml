name: Gold Trading Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa requests
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Verifica requests
        run: |
          python -c "import requests; print('requests OK - versione:', requests.__version__)"

      - name: Avvia bot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python bot.py